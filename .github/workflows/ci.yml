name: TalentAI CI - Build Scan Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: talentai-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build scan and publish
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, talentai-docker]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check .NET SDK
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore TalentAI.csproj

      - name: Build application
        run: dotnet build TalentAI.csproj --configuration Release --no-restore

      - name: Run available tests
        shell: bash
        run: |
          mapfile -t test_projects < <(
            find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
              -not -path '*/obj/*'
          )

          if (( ${#test_projects[@]} == 0 )); then
            echo "::warning::No test projects found. Automated tests were not executed."
          else
            for project in "${test_projects[@]}"; do
              dotnet test "$project" --configuration Release
            done
          fi

      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet list TalentAI.csproj package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/nuget-audit.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nuget-audit.json').read_text())
          if not isinstance(data.get('projects'), list) or not data['projects']:
              raise SystemExit('NuGet audit returned no project results')

          vulnerable = []
          def inspect(value):
              if isinstance(value, dict):
                  findings = value.get('vulnerabilities')
                  if isinstance(findings, list) and findings:
                      vulnerable.extend(findings)
                  for child in value.values():
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)

          inspect(data['projects'])
          print(f'NuGet vulnerability findings: {len(vulnerable)}')
          if vulnerable:
              raise SystemExit('NuGet audit found vulnerable packages')
          PY

      - name: Set commit image tag
        shell: bash
        run: echo "IMAGE_REF=fedimriri/talentai:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build --tag "$IMAGE_REF" .

      - name: Scan image with Trivy
        shell: bash
        run: |
          set -euo pipefail
          TRIVY="$HOME/.local/bin/trivy"
          test -x "$TRIVY"
          "$TRIVY" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_REF"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish scanned image
        run: docker push "$IMAGE_REF"

      - name: Report published image ID
        run: |
          docker image inspect "$IMAGE_REF" --format 'Local image ID: {{.Id}}'
