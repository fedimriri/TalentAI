name: TalentAI CI - .NET Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Restore, Build and Test
    runs-on: [self-hosted, linux, talentai-docker]

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check .NET SDK
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore TalentAI.csproj

      - name: Build application
        run: dotnet build TalentAI.csproj --configuration Release --no-restore

      - name: Run available tests
        shell: bash
        run: |
          mapfile -t test_projects < <(
            find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
              -not -path '*/obj/*'
          )

          if (( ${#test_projects[@]} == 0 )); then
            echo "::warning::No test projects found. Automated tests were not executed."
          else
            for project in "${test_projects[@]}"; do
              dotnet test "$project" --configuration Release
            done
          fi

      - name: Audit NuGet dependencies
        run: dotnet list TalentAI.csproj package --vulnerable --include-transitive
        continue-on-error: true
