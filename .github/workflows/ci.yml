name: Build, scan and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TalentAI.csproj

      - name: Build application
        run: dotnet build TalentAI.csproj --configuration Release --no-restore

      - name: Run available tests
        shell: bash
        run: |
          mapfile -t test_projects < <(
            find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
              -not -path '*/obj/*'
          )

          if (( ${#test_projects[@]} == 0 )); then
            echo "No test projects found"
          else
            for project in "${test_projects[@]}"; do
              dotnet test "$project" --configuration Release
            done
          fi

      - name: Check vulnerable NuGet packages
        run: dotnet list TalentAI.csproj package --vulnerable --include-transitive
        continue-on-error: true

      - name: Set Docker image reference
        run: echo "IMAGE_REF=fedimriri/talentai:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "$IMAGE_REF" .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_REF"
