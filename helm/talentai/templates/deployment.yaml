apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: talentai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
            - secretRef: {name: {{ .Values.secretName }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            timeoutSeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            timeoutSeconds: 5
            periodSeconds: 20
